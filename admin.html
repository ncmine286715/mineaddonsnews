<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Mineaddonsnews</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* Animated bg */
    .bg-animation {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(0,200,83,0.08), transparent 50%),
                  radial-gradient(ellipse at 80% 50%, rgba(0,200,83,0.05), transparent 50%);
    }
    .login-container {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px; padding: 0 1.5rem;
    }
    .login-card {
      background: #111;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00c853, #00e676);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-logo p {
      color: #666;
      font-size: 0.85rem;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      color: #888;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      transition: all 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #00c853;
      box-shadow: 0 0 0 3px rgba(0,200,83,0.1);
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00c853, #009624);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 0.5rem;
      position: relative;
      overflow: hidden;
    }
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,200,83,0.3);
    }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .error-msg {
      color: #ff5252;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 1rem;
      min-height: 1.2rem;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: #555;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .back-link:hover { color: #00c853; }
    .spinner-small {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="bg-animation"></div>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <h1>🧩 Mineaddonsnews</h1>
        <p>Painel Administrativo</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="login-btn" id="loginBtn">Entrar</button>
        <p class="error-msg" id="errorMsg"></p>
      </form>
      <a href="index.html" class="back-link">← Voltar para o site</a>
    </div>
  </div>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAKcFlRmCjuQ35hiGnlDmOPO1P4VdjGZqw",
      authDomain: "mineaddonsnews-web.firebaseapp.com",
      projectId: "mineaddonsnews-web",
      storageBucket: "mineaddonsnews-web.firebasestorage.app",
      messagingSenderId: "877653857210",
      appId: "1:877653857210:web:13cbd8a9d58d611600c383"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Redirect if already logged in
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = 'admin-dashboard.html';
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('errorMsg');
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-small"></span> Entrando...';
      errEl.textContent = '';

      auth.signInWithEmailAndPassword(email, pass)
        .then(() => { window.location.href = 'admin-dashboard.html'; })
        .catch(err => {
          btn.disabled = false;
          btn.textContent = 'Entrar';
          const msgs = {
            'auth/user-not-found': 'Usuário não encontrado.',
            'auth/wrong-password': 'Senha incorreta.',
            'auth/invalid-email': 'E-mail inválido.',
            'auth/too-many-requests': 'Muitas tentativas. Aguarde um momento.',
            'auth/invalid-credential': 'Credenciais inválidas.'
          };
          errEl.textContent = msgs[err.code] || err.message;
        });
    });
  </script>

</body>
</html>
